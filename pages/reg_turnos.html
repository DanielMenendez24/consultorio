<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Turnos | La Segunda Opción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/components/app-header.js" defer></script><script src="../assets/js/components/app-footer.js" defer></script>
</head>

<body>
    <app-header internal></app-header>
    <main>
        <section class="form-section">
            <div class="glass-card">
                <button type="reset" form="form-reg-turno" class="btn-clear-form" title="Vaciar todos los campos">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    <span>Vaciar campos</span>
                </button>
                <h2 class="section-title">Registrar Nuevo Turno</h2>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Cree una nueva cita
                    médica seleccionando una especialidad y un médico disponible.</p>
                <form id="form-reg-turno">
                    <div class="form-grid">
                        <!-- Paciente -->
                        <div class="form-group">
                            <label for="ciPaciente">CI del Paciente*</label>
                            <div class="input-container">
                                <input type="text" id="ciPaciente" name="ciPaciente" placeholder="Ej: 49797260"
                                    required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="nombrePaciente">Nombre del Paciente</label>
                            <div class="input-container">
                                <input type="text" id="nombrePaciente" name="nombrePaciente"
                                    placeholder="Se completará solo..." readonly
                                    style="background: rgba(255,255,255,0.05);">
                            </div>
                        </div>

                        <!-- Médico -->
                        <div class="form-group">
                            <label for="especialidad">Especialidad*</label>
                            <div class="custom-select-wrapper">
                                <select id="especialidad" name="especialidad" required>
                                    <option value="" disabled selected>Seleccione especialidad...</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ciMedico">Médico*</label>
                            <div class="custom-select-wrapper">
                                <select id="ciMedico" name="ciMedico" required disabled>
                                    <option value="" disabled selected>Seleccione especialidad primero...</option>
                                </select>
                            </div>
                        </div>

                        <!-- Datos de la Cita -->
                        <div class="form-group">
                            <label for="fecha">Fecha de la Consulta*</label>
                            <div class="input-container" id="fecha-container">
                                <input type="date" id="fecha" name="fecha" required>
                            </div>
                            <span class="field-error-msg" id="fecha-error">La fecha no puede ser anterior a hoy.</span>
                        </div>
                        <div class="form-group">
                            <label for="hora">Hora de la Consulta*</label>
                            <div class="input-container" id="hora-container">
                                <input type="time" id="hora" name="hora" min="07:00" max="20:00" required>
                            </div>
                            <span class="field-error-msg" id="hora-error">El horario debe estar entre las 07:00 y las 20:00.</span>
                        </div>

                        <div class="form-group">
                            <label for="motivo">Motivo de la Consulta*</label>
                            <div class="input-container">
                                <input type="text" id="motivo" name="motivo"
                                    placeholder="Ej: Dolor de garganta, Control anual" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado del Turno*</label>
                            <div class="custom-select-wrapper">
                                <select id="estado" name="estado" required>
                                    <option value="Pendiente" selected>Pendiente</option>
                                    <option value="Cancelada">Cancelada</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="observaciones">Observaciones adicionales</label>
                            <div class="input-container">
                                <textarea id="observaciones" name="observaciones" rows="3"
                                    placeholder="Información relevante para el médico..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btn-eliminar" class="btn-danger" style="display: none;">Eliminar Turno</button>
                        <button type="button" id="btn-modificar" class="btn-secondary" disabled>Modificar Turno</button>
                        <button type="submit" id="btn-registrar" class="btn-primary">Registrar Turno</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <app-footer></app-footer>
    
    <script src="../assets/js/reg_turnos.js"></script>
</body>

</html>
