<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar médicos | La Segunda Opción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/components/app-header.js" defer></script><script src="../assets/js/components/app-footer.js" defer></script>
    <script src="../assets/js/components/app-header.js" defer></script>
    <script src="../assets/js/components/app-footer.js" defer></script>
</head>

<body>
    <app-header internal></app-header>
    <main>
        <section class="form-section">
            <div class="glass-card">
                <button type="reset" form="form-reg-medico" class="btn-clear-form" title="Vaciar todos los campos">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    <span>Vaciar campos</span>
                </button>
                <h2 class="section-title">Registrar Nuevo Médico</h2>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Los campos marcados con
                    * son obligatorios.</p>
                <form id="form-reg-medico">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="ci">Documento de Identidad (CI)*</label>
                            <div class="input-container" id="ci-container">
                                <input type="text" id="ci" name="ci" placeholder="12345678" required maxlength="8">
                            </div>
                            <span class="field-error-msg" id="ci-error">CI inválida: verifica el dígito verificador.</span>
                        </div>
                        <div class="form-group">
                            <label for="nombre">Nombre*</label>
                            <div class="input-container">
                                <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="apellido">Apellido*</label>
                            <div class="input-container">
                                <input type="text" id="apellido" name="apellido" placeholder="Perez" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="fechaNacimiento">Fecha de nacimiento*</label>
                            <div class="input-container">
                                <input type="date" id="fechaNacimiento" name="fechaNacimiento"
                                    style="padding-left: 2.8rem;" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Sexo*</label>
                            <div class="segmented-control">
                                <input type="radio" id="sexo-m" name="sexo" value="Masculino" required>
                                <label for="sexo-m">Masculino</label>

                                <input type="radio" id="sexo-f" name="sexo" value="Femenino">
                                <label for="sexo-f">Femenino</label>

                                <input type="radio" id="sexo-o" name="sexo" value="Otro">
                                <label for="sexo-o">Otro</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="departamento">Departamento*</label>
                            <div class="custom-select-wrapper">
                                <select id="departamento" name="departamento" required>
                                    <option value="" disabled selected>Seleccione un departamento...</option>
                                    <option value="Montevideo">Montevideo</option>
                                    <option value="Artigas">Artigas</option>
                                    <option value="Canelones">Canelones</option>
                                    <option value="Cerro Largo">Cerro Largo</option>
                                    <option value="Colonia">Colonia</option>
                                    <option value="Durazno">Durazno</option>
                                    <option value="Flores">Flores</option>
                                    <option value="Florida">Florida</option>
                                    <option value="Lavalleja">Lavalleja</option>
                                    <option value="Maldonado">Maldonado</option>
                                    <option value="Paysandú">Paysandú</option>
                                    <option value="Río Negro">Río Negro</option>
                                    <option value="Rivera">Rivera</option>
                                    <option value="Rocha">Rocha</option>
                                    <option value="Salto">Salto</option>
                                    <option value="San José">San José</option>
                                    <option value="Soriano">Soriano</option>
                                    <option value="Tacuarembó">Tacuarembó</option>
                                    <option value="Treinta y Tres">Treinta y Tres</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ciudad">Ciudad*</label>
                            <div class="input-container">
                                <input type="text" id="ciudad" name="ciudad" placeholder="Springfield" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="barrio">Barrio</label>
                            <div class="input-container">
                                <input type="text" id="barrio" name="barrio" placeholder="Centro">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="calle">Calle*</label>
                            <div class="input-container">
                                <input type="text" id="calle" name="calle" placeholder="Siempre Viva" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="numeroPuerta">Número de Puerta*</label>
                            <div class="input-container">
                                <input type="text" id="numeroPuerta" name="numeroPuerta" placeholder="742" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="telPersona">Teléfono(s) (separados por coma)*</label>
                            <div class="input-container">
                                <input type="text" id="telPersona" name="telPersona" placeholder="099123456, 098765432"
                                    required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="especialidad">Especialidad*</label>
                            <div class="custom-select-wrapper">
                                <select id="especialidad" name="especialidad" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="Medicina general">Medicina general</option>
                                    <option value="Pediatria">Pediatria</option>
                                    <option value="Odontologia">Odontologia</option>
                                    <option value="Oftalmologia">Oftalmologia</option>
                                    <option value="Cirujia">Cirujia</option>
                                    <option value="Psicologia">Psicologia</option>
                                    <option value="Urologia">Urologia</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <div class="input-container">
                                <input type="text" id="estado" name="estado" value="Alta" readonly
                                    style="background: rgba(255,255,255,0.05); color: var(--text-muted);">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btn-eliminar" class="btn-danger" disabled>Eliminar Médico</button>
                        <button type="button" id="btn-modificar" class="btn-secondary" disabled>Modificar Datos</button>
                        <button type="submit" class="btn-primary">Registrar Médico</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <app-footer></app-footer>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/reg_medico.js"></script>
</body>

</html>
