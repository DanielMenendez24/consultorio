<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Médicos | La Segunda Opción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/components/app-header.js" defer></script><script src="../assets/js/components/app-footer.js" defer></script>
</head>

<body class="services-page">
    <app-header internal></app-header>
    <main>
        <section class="search-section">
            <div class="search-container glass-card">
                <h2 class="section-title">Buscar Médico</h2>
                <div class="form-group search-form-group">
                    <div class="input-container search-input-wrapper">
                        <div class="search-input-field">
                            <input type="text" id="search-ci" placeholder="Ingrese CI del médico...">
                        </div>
                        <button class="btn-primary search-btn">Buscar</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="table-section">
            <div class="table-container glass-card">
                <h2 class="section-title">Resultados</h2>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Nro. Licencia</th>
                                <th>Documento</th>
                                <th>Médico</th>
                                <th>Sexo</th>
                                <th>Fecha de Nacimiento</th>
                                <th>Dirección</th>
                                <th>Teléfono</th>
                                <th>Especialidad</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="medicos-tbody">
                            <tr>
                                <td colspan="10" class="table-empty-message">
                                    Ingrese un número de CI y presione buscar para ver los datos del médico.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <app-footer></app-footer>
    
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/listar.js"></script>
</body>

</html>
