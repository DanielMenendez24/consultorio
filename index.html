<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | La Segunda Opción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="login-page">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon">
                        <img src="assets/img/lasegundaopcion_logo.png" alt="Logo La Segunda Opción">
                    </span>
                    <h1>La Segunda Opción</h1>
                </div>
                <h2>Bienvenido de nuevo</h2>
                <p>Por favor, ingresa tus credenciales para continuar.</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario o Email</label>
                    <div class="input-container">
                        <!-- <span class="input-icon">👤</span> -->
                        <input type="text" id="username" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-container">
                        <!-- <span class="input-icon">🔒</span> -->
                        <input type="password" id="password" placeholder="••••••••••••••••" required>
                    </div>
                </div>
                <div class="form-actions">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Recuérdame
                    </label>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <div class="login-footer">
                    <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
                </div>
            </form>
        </div>
    </div>
    <script src="assets/js/validation.js"></script>
</body>

</html>
